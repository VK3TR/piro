<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Logged out</title>
  <meta name="theme-color" content="#14171a" />
  <!-- Shown after an idle logout (IDLE_LOGOUT_MINUTES). Standalone on
       purpose: behind a login proxy this page is served without a login
       (oauth2-proxy skip_auth_routes), so it loads nothing else. -->
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #14171a;
      color: #e6e8ea;
      font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    main { max-width: 22rem; padding: 24px 16px; text-align: center; }
    h1 { font-size: 1.3rem; margin: 0 0 12px; }
    p { margin: 0 0 20px; color: #b8bdc2; }
    a {
      display: inline-block;
      padding: 12px 24px;
      border-radius: 6px;
      background: #2f6f3e;
      color: #fff;
      text-decoration: none;
      font-weight: 600;
    }
    a:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  </style>
</head>
<body>
  <main>
    <h1>Logged out</h1>
    <p>You were logged out because there was no activity.</p>
    <a href="/" id="login-again">Log in again</a>
  </main>
</body>
</html>
